name: Update Noticeboard Timestamp

on:
  push:
    paths:
      - 'NOTICEBOARD.md'
      - 'profile/README.md'
  schedule:
    # Update timestamp daily at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-timestamp:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Update noticeboard timestamp
      run: |
        CURRENT_DATE=$(date '+%B %d, %Y')
        
        # Update NOTICEBOARD.md timestamp
        if [ -f "NOTICEBOARD.md" ]; then
          sed -i "s/\*Last updated: .*/\*Last updated: $CURRENT_DATE\*/" NOTICEBOARD.md
        fi
        
        # Check for changes
        if git diff --quiet; then
          echo "No timestamp changes needed"
        else
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add NOTICEBOARD.md
          git commit -m "📅 Update noticeboard timestamp"
          git push
        fi